; ESP32-S3-DevKitC-1U N16R8 with a 4 inch ILI9488 SPI display.
; Some display listings typo ILI9488 as ILI4688, so an alias env is provided below.

[env:esp32-s3-devkitc-1u-ili9488]
extends = env:esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.partitions = custom_16Mb.csv
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
build_src_filter = ${env.build_src_filter} +<../boards/esp32-s3-devkitc-1u-ili9488>
build_flags =
	${env.build_flags}
	-Iboards/esp32-s3-devkitc-1u-ili9488
	-DESP32S3_DEVKITC_1U_ILI9488=1
	-DBOARD_HAS_PSRAM=1
	-DUSB_as_HID=1

	; Features
	-DHAS_SCREEN=1
	-DHAS_TOUCH=1
	-DUSE_TFT_eSPI_TOUCH=1
	-DCORE_DEBUG_LEVEL=1

	; Safe defaults for free headers on the DevKitC-1U N16R8
	-DGROVE_SDA=40
	-DGROVE_SCL=41
	-DSERIAL_TX=43
	-DSERIAL_RX=44
	-DGPS_SERIAL_TX=SERIAL_TX
	-DGPS_SERIAL_RX=SERIAL_RX
	-DTXLED=40
	-DRXLED=41
	-DLED_ON=HIGH
	-DLED_OFF=LOW
	-DIR_TX_PINS='{{"GPIO 40", 40}, {"GPIO 41", 41}}'
	-DIR_RX_PINS='{{"GPIO 40", 40}, {"GPIO 41", 41}}'
	-DRF_TX_PINS='{{"GPIO 40", 40}, {"GPIO 41", 41}}'
	-DRF_RX_PINS='{{"GPIO 40", 40}, {"GPIO 41", 41}}'
	-DBTN_ALIAS='"Touch"'

	; Optional external RF modules share the TFT SPI bus and use their own CS pins
	-DUSE_CC1101_VIA_SPI
	-DCC1101_GDO0_PIN=6
	-DCC1101_SS_PIN=7
	-DCC1101_MOSI_PIN=TFT_MOSI
	-DCC1101_SCK_PIN=TFT_SCLK
	-DCC1101_MISO_PIN=TFT_MISO
	-DUSE_NRF24_VIA_SPI
	-DNRF24_CE_PIN=6
	-DNRF24_SS_PIN=7
	-DNRF24_MOSI_PIN=TFT_MOSI
	-DNRF24_SCK_PIN=TFT_SCLK
	-DNRF24_MISO_PIN=TFT_MISO
	-DSPI_SCK_PIN=TFT_SCLK
	-DSPI_MOSI_PIN=TFT_MOSI
	-DSPI_MISO_PIN=TFT_MISO
	-DSPI_SS_PIN=7

	; SD card is not part of the DevKitC/display wiring by default
	-DSDCARD_CS=-1
	-DSDCARD_SCK=-1
	-DSDCARD_MISO=-1
	-DSDCARD_MOSI=-1

	; TFT_eSPI ILI9488 setup, 320x480 portrait panel rotated to landscape
	-DUSER_SETUP_LOADED=1
	-DILI9488_DRIVER=1
	-DTFT_WIDTH=320
	-DTFT_HEIGHT=480
	-DROTATION=1
	-DTFT_MISO=13
	-DTFT_MOSI=11
	-DTFT_SCLK=12
	-DTFT_CS=10
	-DTFT_DC=9
	-DTFT_RST=14
	-DTFT_BL=21
	-DBACKLIGHT=TFT_BL
	-DTFT_BACKLIGHT_ON=HIGH
	-DMINBRIGHT=25
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000
	-DSPI_TOUCH_FREQUENCY=2500000
	-DTOUCH_CS=8

	; Text sizes
	-DFP=1
	-DFM=2
	-DFG=3
	-DDEVICE_NAME='"ESP32-S3 DevKitC-1U ILI9488"'

lib_deps =
	${env.lib_deps}

[env:esp32-s3-devkitc-1u-ili4688]
extends = env:esp32-s3-devkitc-1u-ili9488
