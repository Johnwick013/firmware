[env:bruce-ultra]
; Bruce Ultra Compact — custom PCB target (pcbs/Bruce_Ultra_Compact)
; Provisional pins: do not flash onto Reaper or other boards.
board = bruce-ultra
board_build.partitions = custom_16Mb.csv
build_src_filter =${env.build_src_filter} +<../boards/bruce-ultra>
build_flags =
	${env.build_flags}
	-Iboards/bruce-ultra
	-Os
	-DARDUINO_USB_MODE=1
	-DCORE_DEBUG_LEVEL=5
	-DBUZZ_PIN=10
	-D USE_HSPI_PORT=1
	-DDEVICE_NAME='"Bruce Ultra Compact"'

	;Infrared Led default pin and state
	-DIR_TX_PINS='{{"IR TX", LED}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 5", 5}, {"GPIO 2", 2}}'
	-DIR_RX_PINS='{{"IR RX", RXLED}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 21", 21}, {"GPIO 1", 1}}'
	-DRF_TX_PINS='{{"CC1101 SMA", CC1101_GDO0_PIN}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'
	-DRF_RX_PINS='{{"CC1101 SMA", CC1101_GDO0_PIN}, {"Grove W", GROVE_SCL}, {"Grove Y", GROVE_SDA}, {"GPIO 1", 1}, {"GPIO 2", 2}}'

lib_deps =
	${env.lib_deps}
	lewisxhe/XPowersLib @0.3.2
